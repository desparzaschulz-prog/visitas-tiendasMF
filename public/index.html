<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Men's Fashion — Visitas a Tiendas</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23000'/%3E%3Cpath fill-rule='evenodd' d='M16 6C10.48 6 6 10.48 6 16s4.48 10 10 10 10-4.48 10-10S21.52 6 16 6zm0 3.6a6.4 6.4 0 0 1 6.4 6.4 6.4 6.4 0 0 1-6.4 6.4A6.4 6.4 0 0 1 9.6 16 6.4 6.4 0 0 1 16 9.6z' fill='%23fff'/%3E%3Crect x='19.5' y='3.5' width='9' height='5.5' fill='%23000'/%3E%3C/svg%3E">
<style>*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0a;--bg3:#1a1a1a;--glass:rgba(255,255,255,.06);--gb:rgba(255,255,255,.12);--gh:rgba(255,255,255,.10);--text:#f0f0f0;--text2:#a0a0a0;--text3:#505050;--r:14px;--rs:8px}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
.app{max-width:960px;margin:0 auto;padding:2rem 1.25rem}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:2.5rem;padding-bottom:1.25rem;border-bottom:.5px solid var(--gb)}
.logo-img{height:26px;opacity:.9}
.sync-row{display:flex;align-items:center;gap:1.25rem}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--text3);display:inline-block;margin-right:6px;transition:background .3s}
.sync-dot.ok{background:#34c759}.sync-dot.syncing{background:#ff9500}.sync-dot.err{background:#ff3b30}
.sync-label{font-size:11px;color:var(--text3);font-weight:500}
.nav{display:flex;gap:4px;background:var(--glass);border:.5px solid var(--gb);border-radius:100px;padding:4px;backdrop-filter:blur(20px)}
.nav-btn{font-size:12px;padding:6px 14px;border-radius:100px;border:none;background:none;cursor:pointer;color:var(--text2);transition:all .18s;font-family:inherit;font-weight:500}
.nav-btn.active{background:rgba(255,255,255,.15);color:var(--text)}
.nav-btn:hover:not(.active){color:var(--text);background:rgba(255,255,255,.07)}
.page{display:none}.page.active{display:block}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:1.75rem}
.metric{background:var(--glass);border:.5px solid var(--gb);border-radius:var(--r);padding:16px 18px;backdrop-filter:blur(20px)}
.metric-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;font-weight:500}
.metric-val{font-size:28px;font-weight:600;color:var(--text);margin-top:6px;letter-spacing:-.02em}
.controls{display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap;align-items:center}
.controls input,.controls select{font-size:13px;padding:9px 14px;border:.5px solid var(--gb);border-radius:var(--rs);background:var(--glass);color:var(--text);outline:none;font-family:inherit;backdrop-filter:blur(20px)}
.controls input{flex:1;min-width:180px}
.controls input::placeholder{color:var(--text3)}
.controls select option{background:#1a1a1a;color:var(--text)}
.controls input:focus,.controls select:focus{border-color:rgba(255,255,255,.3)}
.btn-export{background:rgba(52,199,89,.15);color:#34c759;border:.5px solid rgba(52,199,89,.3);padding:8px 14px;border-radius:100px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:500;white-space:nowrap}
.btn-export:hover{background:rgba(52,199,89,.25)}
.store-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;margin-bottom:1.5rem}
.store-card{background:var(--glass);border:.5px solid var(--gb);border-radius:var(--r);padding:1.1rem 1.25rem;cursor:pointer;transition:all .18s;backdrop-filter:blur(20px)}
.store-card:hover{background:var(--gh);border-color:rgba(255,255,255,.2);transform:translateY(-1px)}
.store-card.active{border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.1)}
.store-name{font-size:14px;font-weight:600;color:var(--text);margin-bottom:8px}
.store-meta{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px}
.tag{font-size:11px;padding:3px 9px;border-radius:100px;font-weight:500}
.tag-w{background:rgba(255,255,255,.15);color:var(--text);border:.5px solid rgba(255,255,255,.2)}
.tag-d{background:rgba(255,255,255,.07);color:var(--text2);border:.5px solid var(--gb)}
.tag-g{background:rgba(52,199,89,.15);color:#34c759;border:.5px solid rgba(52,199,89,.25)}
.detail-wrap{background:var(--glass);border:.5px solid var(--gb);border-radius:var(--r);padding:1.4rem;margin-bottom:1.5rem;backdrop-filter:blur(20px)}
.detail-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:8px}
.detail-title{font-size:15px;font-weight:600;color:var(--text)}
.detail-actions{display:flex;gap:6px;align-items:center}
.icon-btn{background:rgba(255,255,255,.08);border:.5px solid var(--gb);cursor:pointer;font-size:13px;color:var(--text2);padding:5px 12px;border-radius:100px;font-family:inherit;font-weight:500;transition:all .15s}
.icon-btn:hover{background:rgba(255,255,255,.15);color:var(--text)}
.icon-btn.danger:hover{background:rgba(255,59,48,.15);color:#ff3b30;border-color:rgba(255,59,48,.3)}
.close-btn{background:rgba(255,255,255,.1);border:.5px solid var(--gb);cursor:pointer;font-size:16px;color:var(--text2);width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.close-btn:hover{background:rgba(255,255,255,.18);color:var(--text)}
.sec-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:1rem}
.sec-tab{font-size:12px;padding:5px 12px;border-radius:100px;border:.5px solid var(--gb);background:none;cursor:pointer;color:var(--text2);transition:all .12s;font-family:inherit;font-weight:500}
.sec-tab.active{background:rgba(255,255,255,.15);color:var(--text);border-color:rgba(255,255,255,.25)}
.sec-tab:hover:not(.active){background:var(--glass);color:var(--text)}
.qa-list{display:flex;flex-direction:column;gap:12px}
.qa-item{border-left:1.5px solid var(--gb);padding-left:14px}
.qa-item.hit{border-left-color:rgba(255,255,255,.6);border-left-width:2px}
.qa-q{font-size:12px;color:var(--text3);margin-bottom:3px;font-weight:500}
.qa-a{font-size:13px;color:var(--text2);line-height:1.55}
.form-wrap{max-width:620px}
.step-bar{display:flex;gap:4px;margin-bottom:1.75rem}
.step{flex:1;height:2px;background:var(--gb);border-radius:2px;transition:background .25s}
.step.done{background:rgba(255,255,255,.7)}
.form-title{font-size:17px;font-weight:600;color:var(--text);margin-bottom:4px}
.form-sub{font-size:13px;color:var(--text3);margin-bottom:1.5rem}
.form-grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1rem}
.form-row{margin-bottom:10px}
.form-label{font-size:12px;color:var(--text2);margin-bottom:5px;display:block;font-weight:500}
.form-row textarea,.form-row input[type=text],.form-row input[type=date],.form-row input[type=password]{width:100%;font-size:13px;padding:9px 12px;border:.5px solid var(--gb);border-radius:var(--rs);background:var(--bg3);color:var(--text);outline:none;font-family:inherit}
.form-row textarea{resize:vertical;min-height:60px}
.form-row input:focus,.form-row textarea:focus{border-color:rgba(255,255,255,.3)}
.form-actions{display:flex;gap:8px;padding-top:1rem;border-top:.5px solid var(--gb);margin-top:1rem;flex-wrap:wrap}
.btn-primary{background:rgba(255,255,255,.92);color:#0a0a0a;border:none;padding:9px 20px;border-radius:var(--rs);font-size:13px;cursor:pointer;font-weight:600;font-family:inherit}
.btn-primary:hover{background:#fff}
.btn-secondary{background:var(--glass);color:var(--text2);border:.5px solid var(--gb);padding:9px 16px;border-radius:var(--rs);font-size:13px;cursor:pointer;font-family:inherit}
.btn-secondary:hover{background:var(--gh);color:var(--text)}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(10px);z-index:100;display:none;align-items:center;justify-content:center;padding:1rem}
.modal-backdrop.open{display:flex}
.modal{background:#141414;border:.5px solid var(--gb);border-radius:var(--r);padding:1.5rem;width:100%;max-width:600px;max-height:90vh;overflow-y:auto}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem}
.modal-title{font-size:16px;font-weight:600;color:var(--text)}
.edit-sec-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:1.25rem}
.edit-sec-tab{font-size:12px;padding:5px 12px;border-radius:100px;border:.5px solid var(--gb);background:none;cursor:pointer;color:var(--text2);font-family:inherit;font-weight:500;transition:all .12s}
.edit-sec-tab.active{background:rgba(255,255,255,.15);color:var(--text);border-color:rgba(255,255,255,.25)}
.pin-modal{background:#141414;border:.5px solid var(--gb);border-radius:var(--r);padding:1.75rem;width:100%;max-width:300px;text-align:center}
.pin-modal h3{font-size:15px;font-weight:600;color:var(--text);margin-bottom:6px}
.pin-modal p{font-size:13px;color:var(--text3);margin-bottom:1.25rem}
.pin-input{width:100%;font-size:24px;padding:10px;border:.5px solid var(--gb);border-radius:var(--rs);background:var(--bg3);color:var(--text);outline:none;font-family:inherit;text-align:center;letter-spacing:8px;margin-bottom:1rem}
.pin-error{font-size:12px;color:#ff3b30;margin-bottom:.75rem;display:none}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:rgba(28,28,28,.95);color:var(--text);font-size:13px;padding:11px 22px;border-radius:100px;display:none;z-index:999;white-space:nowrap;border:.5px solid var(--gb);backdrop-filter:blur(20px);font-weight:500}
.toast.show{display:block}
.empty{text-align:center;padding:3rem;color:var(--text3);font-size:14px}
.counter{font-size:12px;color:var(--text3);margin-bottom:1rem}
.diag-grid{display:flex;flex-direction:column;gap:14px}
.diag-card{background:var(--glass);border:.5px solid var(--gb);border-radius:var(--r);padding:1.25rem;backdrop-filter:blur(20px)}
.diag-card-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:1rem}
.diag-card-body{font-size:13px;color:var(--text2)}
.diag-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.diag-stat{background:var(--bg3);border-radius:var(--rs);padding:12px;text-align:center}
.diag-stat-val{font-size:24px;font-weight:600;color:var(--text)}
.diag-stat-lbl{font-size:11px;color:var(--text3);margin-top:4px}
.diag-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.diag-bar-label{font-size:13px;color:var(--text2);width:140px;flex-shrink:0;text-transform:capitalize}
.diag-bar-track{flex:1;height:6px;background:var(--gb);border-radius:3px;overflow:hidden}
.diag-bar-fill{height:100%;background:rgba(255,59,48,.7);border-radius:3px}
.diag-bar-count{font-size:12px;color:var(--text3);width:36px;text-align:right;flex-shrink:0}
.diag-chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:4px 10px;border-radius:100px;background:rgba(255,255,255,.08);border:.5px solid var(--gb);color:var(--text2)}
.diag-chip strong{color:var(--text)}
.diag-list-item{padding:8px 0;border-bottom:.5px solid var(--gb);line-height:1.5;display:flex;gap:10px;align-items:baseline}
.diag-list-item:last-child{border-bottom:none}
.diag-idx{font-size:11px;color:var(--text3);white-space:nowrap;flex-shrink:0;font-weight:500;min-width:100px}
.diag-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:10px}
.diag-title{font-size:17px;font-weight:600;color:var(--text)}
.diag-sub{font-size:13px;color:var(--text3);margin-top:2px}</style>
</head>
<body>
<div class="app">
  <header>
    <img class="logo-img" id="logoImg" alt="Men's Fashion">
    <div class="sync-row">
      <div><span class="sync-dot" id="syncDot"></span><span class="sync-label" id="syncLabel">Conectando…</span></div>
      <div class="nav">
        <button class="nav-btn active" onclick="showPage('repo')" id="nb-repo">Repositorio</button>
        <button class="nav-btn" onclick="showPage('nueva')" id="nb-nueva">+ Nueva visita</button>
        <button class="nav-btn" onclick="showPage('diagnostico')" id="nb-diagnostico">📊 Diagnóstico</button>
      </div>
    </div>
  </header>

  <!-- REPOSITORIO -->
  <div id="page-repo" class="page active">
    <div class="summary-grid" id="summaryGrid"></div>
    <div class="controls">
      <input type="text" id="search" placeholder="Buscar en todas las respuestas…" oninput="renderRepo()">
      <select id="fSec" onchange="renderRepo()">
        <option value="">Todas las secciones</option>
        <option value="perfil">Perfil del cliente</option>
        <option value="producto">Producto y surtido</option>
        <option value="equipo">Equipo de piso</option>
        <option value="visual">Visual merchandising</option>
        <option value="competencia">Mercado y competencia</option>
        <option value="operacion">Operación y datos</option>
      </select>
      <select id="fTienda" onchange="renderRepo()"><option value="">Todas las tiendas</option></select>
      <button class="btn-export" onclick="exportExcel()">⬇ Exportar Excel</button>
    </div>
    <div class="counter" id="counter"></div>
    <div class="store-grid" id="storeGrid"></div>
    <div id="detailWrap" style="display:none">
      <div class="detail-wrap">
        <div class="detail-header">
          <span class="detail-title" id="detailTitle"></span>
          <div class="detail-actions">
            <button class="icon-btn" onclick="requirePin('edit')">🔒 Editar</button>
            <button class="icon-btn danger" onclick="requirePin('delete')">🔒 Eliminar</button>
            <button class="close-btn" onclick="closeDetail()">×</button>
          </div>
        </div>
        <div class="sec-tabs" id="secTabs"></div>
        <div class="qa-list" id="qaList"></div>
      </div>
    </div>
  </div>

  <!-- NUEVA VISITA -->
  <div id="page-nueva" class="page">
    <div class="step-bar" id="stepBar"></div>
    <div class="form-wrap" id="formWrap"></div>
  </div>

  <!-- DIAGNÓSTICO -->
  <div id="page-diagnostico" class="page">
    <div class="diag-header">
      <div>
        <div class="diag-title">📊 Diagnóstico cruzado</div>
        <div class="diag-sub">Patrones detectados en todas las tiendas registradas</div>
      </div>
      <button class="btn-export" onclick="renderDiag()">↺ Actualizar</button>
    </div>
    <div class="diag-grid" id="diagContent"></div>
  </div>
</div>

<!-- PIN MODAL -->
<div class="modal-backdrop" id="pinModal">
  <div class="pin-modal">
    <h3>🔒 Acceso restringido</h3>
    <p>Ingresa la clave para continuar</p>
    <input type="password" class="pin-input" id="pinInput" maxlength="10" placeholder="····" onkeydown="if(event.key==='Enter')checkPin()">
    <div class="pin-error" id="pinError">Clave incorrecta</div>
    <div style="display:flex;gap:8px;justify-content:center">
      <button class="btn-secondary" onclick="closePinModal()">Cancelar</button>
      <button class="btn-primary" onclick="checkPin()">Entrar</button>
    </div>
  </div>
</div>

<!-- EDIT MODAL -->
<div class="modal-backdrop" id="editModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="editModalTitle">Editar visita</span>
      <button class="close-btn" onclick="closeEditModal()">×</button>
    </div>
    <div class="form-grid2" style="margin-bottom:1rem">
      <div class="form-row"><label class="form-label">Nombre de la tienda</label><input type="text" id="edit-nombre"></div>
      <div class="form-row"><label class="form-label">Fecha</label><input type="date" id="edit-fecha"></div>
    </div>
    <div class="form-row" style="margin-bottom:.75rem"><label class="form-label">Equipo</label><input type="text" id="edit-equipo"></div>
    <div class="form-row" style="margin-bottom:1.25rem"><label class="form-label">Notas libres</label><textarea id="edit-notas" style="min-height:60px"></textarea></div>
    <div class="edit-sec-tabs" id="editSecTabs"></div>
    <div id="editQaList"></div>
    <div class="form-actions">
      <button class="btn-secondary" onclick="closeEditModal()">Cancelar</button>
      <button class="btn-primary" onclick="saveEdit()">Guardar cambios</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

// Convierte CUALQUIER valor a string limpio
function str(v){
  if(v===null||v===undefined)return"";
  if(typeof v==="string")return v;
  if(typeof v==="number")return String(v);
  if(Array.isArray(v))return v.map(str).join(", ");
  if(typeof v==="object")return Object.values(v).map(str).filter(Boolean).join(" ");
  return String(v);
}

// Convierte CUALQUIER valor a array de strings del tamaño correcto
function toArr(sec,val){
  const len=SECCIONES[sec].length;
  if(!val)return Array(len).fill("");
  if(Array.isArray(val))return SECCIONES[sec].map((_,i)=>str(val[i]||""));
  if(typeof val==="object")return SECCIONES[sec].map((_,i)=>str(val[i]||val[String(i)]||""));
  return Array(len).fill("");
}

// Normaliza una tienda a formato limpio sin importar cómo venga del bin
function norm(t){
  return{
    id:str(t.id)||"t_"+Date.now(),
    nombre:str(t.nombre),
    fecha:str(t.fecha),
    equipo:str(t.equipo),
    notas:str(t.notas),
    secciones:Object.fromEntries(Object.keys(SECCIONES).map(sec=>[sec,toArr(sec,t.secciones?.[sec])]))
  };
}

function gs(k){try{return localStorage.getItem(k)}catch(e){return null}}
function ss(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function setSync(s,l){document.getElementById("syncDot").className="sync-dot"+(s?" "+s:"");document.getElementById("syncLabel").textContent=l;}

async function jb(url,opts){return fetch(url,{...opts,headers:{"Content-Type":"application/json","X-Master-Key":JB_KEY,...(opts?.headers||{})}});}

async function loadDB(){
  setSync("syncing","Conectando\u2026");
  try{
    const r=await jb("https://api.jsonbin.io/v3/b/"+BIN_ID+"/latest");
    if(r.ok){
      const d=await r.json();
      DB=(d.record.tiendas||[]).map(norm);
      ss("tiendas_local",JSON.stringify(DB));
      setSync("ok","En l\u00ednea \u00b7 compartido");
      return;
    }
  }catch(e){}
  try{const local=gs("tiendas_local");DB=local?JSON.parse(local).map(norm):[];}catch(e){DB=[];}
  setSync("err","Sin conexi\u00f3n \u2014 datos locales");
}

async function saveDB(){
  ss("tiendas_local",JSON.stringify(DB));
  setSync("syncing","Guardando\u2026");
  try{
    const r=await jb("https://api.jsonbin.io/v3/b/"+BIN_ID,{method:"PUT",body:JSON.stringify({tiendas:DB})});
    if(r.ok){setSync("ok","Guardado \u00b7 compartido");return;}
  }catch(e){}
  setSync("err","Error al guardar");
}

  const shown=DB.filter(t=>{
    if(fTienda&&t.id!==fTienda)return false;
    if(!q&&!fSec)return true;
    for(const[sec,answers]of Object.entries(t.secciones)){
      if(fSec&&sec!==fSec)continue;
      const qs=SECCIONES[sec]||[];
      for(let i=0;i<answers.length;i++){if((qs[i]||"").toLowerCase().includes(q)||answers[i].toLowerCase().includes(q))return true;}
    }
    if(t.notas.toLowerCase().includes(q))return true;
    return false;
  });
  const totalQs=Object.values(SECCIONES).flat().length;
  document.getElementById("counter").textContent=shown.length===DB.length?DB.length+" tiendas registradas":shown.length+" de "+DB.length+" tiendas";
  document.getElementById("summaryGrid").innerHTML=
    "<div class='metric'><div class='metric-label'>Tiendas</div><div class='metric-val'>"+DB.length+"</div></div>"+
    "<div class='metric'><div class='metric-label'>Objetivo</div><div class='metric-val'>110</div></div>"+
    "<div class='metric'><div class='metric-label'>Avance</div><div class='metric-val'>"+Math.round(DB.length/110*100)+"%</div></div>"+
    "<div class='metric'><div class='metric-label'>\u00daltima visita</div><div class='metric-val' style='font-size:15px'>"+(DB.length?DB[DB.length-1].nombre:"\u2014")+"</div></div>";
  const grid=document.getElementById("storeGrid");grid.innerHTML="";
  if(!shown.length){grid.innerHTML="<div class='empty'>Sin resultados</div>";closeDetail();return;}
  shown.forEach(t=>{
    const total=countResp(t);
    const pct=Math.round(total/totalQs*100);
    const card=document.createElement("div");card.className="store-card"+(activeId===t.id?" active":"");
    card.onclick=()=>openDetail(t.id);
    const barColor=pct>=70?"#34c759":pct>=40?"#ff9500":"#ff3b30";
    card.innerHTML=
      "<div class='store-name'>"+t.nombre+"</div>"+
      "<div class='store-meta'>"+
        "<span class='tag tag-d'>"+t.fecha+"</span>"+
        "<span class='tag tag-w'>"+total+" resp.</span>"+
        (t.equipo?"<span class='tag tag-g'>"+t.equipo+"</span>":"")+
      "</div>"+
      "<div style='margin-top:8px;height:3px;background:var(--gb);border-radius:2px;overflow:hidden'>"+
        "<div style='height:100%;width:"+pct+"%;background:"+barColor+";border-radius:2px'></div>"+
      "</div>"+
      "<div style='font-size:11px;color:var(--text3);margin-top:4px'>"+pct+"% completado"+(t.notas?" \u00b7 \ud83d\udcdd nota":"")+"</div>";
    grid.appendChild(card);
  });
  if(activeId){const s=shown.find(t=>t.id===activeId);if(s)renderDetail(s,activeSec);else closeDetail();}
}

function openDetail(id){const t=DB.find(x=>x.id===id);if(!t)return;activeId=id;document.getElementById("detailWrap").style.display="block";renderDetail(t,activeSec);}
function closeDetail(){activeId=null;document.getElementById("detailWrap").style.display="none";document.querySelectorAll(".store-card").forEach(c=>c.classList.remove("active"));}

function renderDetail(t,sec){
  activeSec=sec;
  document.getElementById("detailTitle").textContent=t.nombre+" \u00b7 "+t.fecha;
  const tabs=document.getElementById("secTabs");tabs.innerHTML="";
  [...Object.entries(SEC_LABELS),["notas","\ud83d\udcdd Notas"]].forEach(([k,v])=>{
    const btn=document.createElement("button");btn.className="sec-tab"+(k===sec?" active":"");btn.textContent=v;btn.onclick=()=>renderDetail(t,k);tabs.appendChild(btn);
  });
  const qaList=document.getElementById("qaList");qaList.innerHTML="";
  if(sec==="notas"){
    const box=document.createElement("div");
    box.style.cssText="background:var(--bg3);border:.5px solid var(--gb);border-radius:var(--rs);padding:14px;font-size:13px;color:var(--text2);line-height:1.7;white-space:pre-wrap;min-height:80px";
    box.textContent=t.notas||"Sin notas registradas.";
    qaList.appendChild(box);return;
  }
  const q=document.getElementById("search").value.toLowerCase().trim();
  const qs=SECCIONES[sec]||[],answers=t.secciones[sec]||[];
  qs.forEach((question,i)=>{
    const ans=answers[i]||"\u2014";const hit=q&&((question+ans).toLowerCase().includes(q));
    const item=document.createElement("div");item.className="qa-item"+(hit?" hit":"");
    item.innerHTML="<div class='qa-q'>"+question+"</div><div class='qa-a'>"+ans+"</div>";
    qaList.appendChild(item);
  });
  document.querySelectorAll(".store-card").forEach(c=>c.classList.remove("active"));
  document.querySelectorAll(".store-card").forEach(c=>{if(c.querySelector(".store-name")?.textContent===t.nombre)c.classList.add("active");});
}

// EXPORTAR EXCEL (CSV)
function exportExcel(){
  if(!DB.length){showToast("No hay datos para exportar");return;}
  const allQs=Object.entries(SECCIONES).flatMap(([sec,qs])=>qs.map(q=>sec.toUpperCase()+": "+q));
  const header=["Tienda","Fecha","Equipo",...allQs,"Notas"];
  const rows=DB.map(t=>{
    const vals=Object.entries(SECCIONES).flatMap(([sec,qs])=>qs.map((_,i)=>(t.secciones[sec]||[])[i]||""));
    return[t.nombre,t.fecha,t.equipo,...vals,t.notas];
  });
  const esc=v=>'"'+String(v||"").replace(/"/g,'""')+'"';
  const csv=[header,...rows].map(r=>r.map(esc).join(",")).join("\r\n");
  const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="visitas_"+new Date().toISOString().slice(0,10)+".csv";
  a.click();showToast("\u2713 Descargado \u2014 \u00e1brelo en Excel");
}

// DIAGNÓSTICO
function renderDiag(){
  const cont=document.getElementById("diagContent");
  if(!DB.length){cont.innerHTML="<div class='empty'>No hay tiendas registradas a\u00fan.</div>";return;}
  cont.innerHTML="";
  const n=DB.length;
  const totalQs=Object.values(SECCIONES).flat().length;

  // Stats generales
  const avgPct=Math.round(DB.reduce((s,t)=>s+countResp(t),0)/n/totalQs*100);
  const precJusto=DB.filter(t=>(t.secciones.producto[6]||"").toLowerCase().includes("justo")).length;
  const precCaro=DB.filter(t=>(t.secciones.producto[6]||"").toLowerCase().includes("caro")).length;
  addDiagCard(cont,"\ud83d\udcca Resumen general",
    "<div class='diag-stats'>"+
    dstat(DB.length,"Tiendas")+dstat(avgPct+"%","Completitud prom.")+
    dstat(precJusto,"Precio percibido justo")+dstat(precCaro,"Precio percibido caro")+
    "</div>"
  );

  // Competidores
  const compC={};
  DB.forEach(t=>{(t.secciones.competencia[0]||"").split(/[,\/yY&]+/).forEach(c=>{const k=c.trim().toLowerCase();if(k.length>2)compC[k]=(compC[k]||0)+1;});});
  const topComp=Object.entries(compC).sort((a,b)=>b[1]-a[1]).slice(0,6);
  if(topComp.length)addDiagCard(cont,"\ud83d\udd35 Competidores m\u00e1s mencionados",
    topComp.map(([k,v])=>dbar(k.charAt(0).toUpperCase()+k.slice(1),v,n)).join("")
  );

  // Tallas agotadas
  const tallasC={};
  DB.forEach(t=>{(t.secciones.producto[1]||"").split(/[\s,\/yY]+/).forEach(x=>{const k=x.trim();if(/^\d{2,3}$|^[xXsSmMlLgGcC]+$/.test(k))tallasC[k]=(tallasC[k]||0)+1;});});
  const topT=Object.entries(tallasC).sort((a,b)=>b[1]-a[1]).slice(0,8);
  if(topT.length)addDiagCard(cont,"\ud83d\udc55 Tallas que m\u00e1s se agotan",
    "<div style='display:flex;flex-wrap:wrap;gap:8px;margin-top:4px'>"+topT.map(([k,v])=>dchip(k,v)).join("")+"</div>"
  );

  // Días pico
  const diasC={};
  DB.forEach(t=>{const v=(t.secciones.competencia[10]||"").toLowerCase();["lunes","martes","miércoles","jueves","viernes","sábado","domingo","fines de semana"].forEach(d=>{if(v.includes(d))diasC[d]=(diasC[d]||0)+1;});});
  const topD=Object.entries(diasC).sort((a,b)=>b[1]-a[1]).slice(0,5);
  if(topD.length)addDiagCard(cont,"\ud83d\udcc5 D\u00edas de mayor tr\u00e1fico",
    "<div style='display:flex;flex-wrap:wrap;gap:8px;margin-top:4px'>"+topD.map(([k,v])=>dchip(k.charAt(0).toUpperCase()+k.slice(1),v)).join("")+"</div>"
  );

  // Gaps de producto
  const gaps=DB.map(t=>({n:t.nombre,v:(t.secciones.producto[8]||"").trim()})).filter(x=>x.v);
  if(gaps.length)addDiagCard(cont,"\u26a0\ufe0f Gaps de producto \u2014 qu\u00e9 buscan y no tenemos",
    gaps.map(x=>"<div class='diag-list-item'><span class='diag-idx'>"+x.n+"</span>"+x.v+"</div>").join("")
  );

  // Objeciones
  const objs=DB.map(t=>({n:t.nombre,v:(t.secciones.equipo[3]||"").trim()})).filter(x=>x.v);
  if(objs.length)addDiagCard(cont,"\ud83d\udcac Objeciones m\u00e1s comunes al cierre",
    objs.map(x=>"<div class='diag-list-item'><span class='diag-idx'>"+x.n+"</span>"+x.v+"</div>").join("")
  );

  // Saturación
  const sats=DB.map(t=>({n:t.nombre,v:(t.secciones.equipo[10]||"").trim()})).filter(x=>x.v);
  if(sats.length)addDiagCard(cont,"\u23f0 Momentos de saturaci\u00f3n de atenci\u00f3n",
    sats.map(x=>"<div class='diag-list-item'><span class='diag-idx'>"+x.n+"</span>"+x.v+"</div>").join("")
  );

  // Argumentos que cierran
  const args=DB.map(t=>({n:t.nombre,v:(t.secciones.equipo[7]||"").trim()})).filter(x=>x.v);
  if(args.length)addDiagCard(cont,"\u2728 Argumentos que m\u00e1s cierran ventas",
    args.map(x=>"<div class='diag-list-item'><span class='diag-idx'>"+x.n+"</span>"+x.v+"</div>").join("")
  );
}
function addDiagCard(cont,title,body){const c=document.createElement("div");c.className="diag-card";c.innerHTML="<div class='diag-card-title'>"+title+"</div><div class='diag-card-body'>"+body+"</div>";cont.appendChild(c);}
function dstat(val,lbl){return"<div class='diag-stat'><div class='diag-stat-val'>"+val+"</div><div class='diag-stat-lbl'>"+lbl+"</div></div>";}
function dbar(label,v,n){return"<div class='diag-bar-row'><div class='diag-bar-label'>"+label+"</div><div class='diag-bar-track'><div class='diag-bar-fill' style='width:"+Math.round(v/n*100)+"%'></div></div><div class='diag-bar-count'>"+v+"/"+n+"</div></div>";}
function dchip(k,v){return"<span class='diag-chip'>"+k+" <strong>\u00d7"+v+"</strong></span>";}

// FORMULARIO
function renderForm(){
  document.getElementById("stepBar").innerHTML=STEPS.map((_,i)=>"<div class='step"+(i<=formStep?" done":"")+"'></div>").join("");
  const wrap=document.getElementById("formWrap");wrap.innerHTML="";
  if(formStep===0){
    const d=document.createElement("div");
    d.innerHTML="<div class='form-title'>Datos de la visita</div><div class='form-sub'>Paso 1 de 8</div>"+
      "<div class='form-grid2'><div class='form-row'><label class='form-label'>Nombre de la tienda *</label><input type='text' id='f-nombre' placeholder='Ej. Perisur'></div>"+
      "<div class='form-row'><label class='form-label'>Fecha</label><input type='date' id='f-fecha'></div></div>"+
      "<div class='form-row'><label class='form-label'>Equipo (nombres)</label><input type='text' id='f-equipo' placeholder='Ej. Ana, Rodrigo'></div>"+
      "<div class='form-actions'><button class='btn-secondary' id='btnCancel'>Cancelar</button><button class='btn-primary' id='btnNext0'>Siguiente \u2192</button></div>";
    wrap.appendChild(d);
    document.getElementById("f-nombre").value=draft.nombre||"";
    document.getElementById("f-fecha").value=draft.fecha||new Date().toISOString().slice(0,10);
    document.getElementById("f-equipo").value=draft.equipo||"";
    document.getElementById("btnCancel").onclick=()=>showPage("repo");
    document.getElementById("btnNext0").onclick=nextStep;
    return;
  }
  if(formStep===7){
    const d=document.createElement("div");
    d.innerHTML="<div class='form-title'>\ud83d\udcdd Notas libres</div><div class='form-sub'>Paso 8 de 8 \u00b7 Observaciones adicionales (opcional)</div>"+
      "<div class='form-row'><label class='form-label'>Notas de la visita</label><textarea id='f-notas' placeholder='Ambiente del mall, actitud del equipo, hallazgos inesperados...' style='min-height:160px'></textarea></div>"+
      "<div class='form-actions'><button class='btn-secondary' id='btnBack7'>Atr\u00e1s</button><button class='btn-primary' id='btnSave'>\u2713 Guardar visita</button></div>";
    wrap.appendChild(d);
    document.getElementById("f-notas").value=draft.notas||"";
    document.getElementById("btnBack7").onclick=prevStep;
    document.getElementById("btnSave").onclick=nextStep;
    return;
  }
  const secKey=STEPS[formStep],questions=SECCIONES[secKey],saved=draft[secKey]||{};
  const d=document.createElement("div");
  d.innerHTML="<div class='form-title'>"+SEC_LABELS[secKey]+"</div><div class='form-sub'>Paso "+(formStep+1)+" de 8 \u00b7 "+questions.length+" preguntas</div>"+
    questions.map((q,i)=>"<div class='form-row'><label class='form-label'>"+q+"</label><textarea id='fq-"+i+"' placeholder='Respuesta\u2026'></textarea></div>").join("")+
    "<div class='form-actions'><button class='btn-secondary' id='btnBackN'>Atr\u00e1s</button><button class='btn-primary' id='btnNextN'>Siguiente \u2192</button></div>";
  wrap.appendChild(d);
  questions.forEach((_,i)=>{const el=document.getElementById("fq-"+i);if(el)el.value=saved[i]||"";});
  document.getElementById("btnBackN").onclick=prevStep;
  document.getElementById("btnNextN").onclick=nextStep;
}

function collectMeta(){draft.nombre=str(document.getElementById("f-nombre")?.value);draft.fecha=str(document.getElementById("f-fecha")?.value);draft.equipo=str(document.getElementById("f-equipo")?.value);}
function collectSection(){const sk=STEPS[formStep],qs=SECCIONES[sk];draft[sk]={};qs.forEach((_,i)=>{draft[sk][i]=str(document.getElementById("fq-"+i)?.value);});}
function collectNotas(){draft.notas=str(document.getElementById("f-notas")?.value);}

async function nextStep(){
  if(formStep===0){collectMeta();if(!draft.nombre.trim()){showToast("Escribe el nombre de la tienda");return;}}
  else if(formStep===7){collectNotas();}
  else collectSection();
  if(formStep<7){formStep++;renderForm();return;}
  const secs={};
  Object.keys(SECCIONES).forEach(sec=>{const d=draft[sec]||{};secs[sec]=SECCIONES[sec].map((_,i)=>str(d[i]||""));});
  DB.push(norm({id:"t_"+Date.now(),nombre:draft.nombre,fecha:draft.fecha,equipo:draft.equipo,notas:draft.notas||"",secciones:secs}));
  await saveDB();showToast("\u2713 Visita guardada y sincronizada");draft={};formStep=0;
  setTimeout(()=>showPage("repo"),1000);
}
function prevStep(){
  if(formStep===0)return;
  if(formStep===7)collectNotas();else collectSection();
  formStep--;renderForm();
}

// EDIT MODAL
function openEditModal(){
  const t=DB.find(x=>x.id===activeId);if(!t)return;editSec="perfil";
  document.getElementById("editModalTitle").textContent="Editar \u2014 "+t.nombre;
  document.getElementById("edit-nombre").value=t.nombre;
  document.getElementById("edit-fecha").value=t.fecha;
  document.getElementById("edit-equipo").value=t.equipo;
  document.getElementById("edit-notas").value=t.notas;
  renderEditTabs();renderEditQA();document.getElementById("editModal").classList.add("open");
}
function closeEditModal(){document.getElementById("editModal").classList.remove("open");}
function renderEditTabs(){
  const tabs=document.getElementById("editSecTabs");tabs.innerHTML="";
  [...Object.entries(SEC_LABELS),["notas","\ud83d\udcdd Notas"]].forEach(([k,v])=>{
    const btn=document.createElement("button");btn.className="edit-sec-tab"+(k===editSec?" active":"");btn.textContent=v;btn.onclick=()=>switchEditSec(k);tabs.appendChild(btn);
  });
}
function switchEditSec(sec){saveEditCurrentSec();editSec=sec;renderEditTabs();renderEditQA();}
function saveEditCurrentSec(){
  const t=DB.find(x=>x.id===activeId);if(!t)return;
  if(editSec==="notas"){t.notas=str(document.getElementById("edit-notas-field")?.value);return;}
  if(!t.secciones[editSec])t.secciones[editSec]=[];
  SECCIONES[editSec].forEach((_,i)=>{const el=document.getElementById("eq-"+i);if(el)t.secciones[editSec][i]=str(el.value);});
}
function renderEditQA(){
  const t=DB.find(x=>x.id===activeId);if(!t)return;
  const list=document.getElementById("editQaList");list.innerHTML="";
  if(editSec==="notas"){
    const row=document.createElement("div");row.className="form-row";
    const label=document.createElement("label");label.className="form-label";label.textContent="Notas de la visita";
    const ta=document.createElement("textarea");ta.id="edit-notas-field";ta.style.cssText="min-height:140px;width:100%;font-size:13px;padding:8px 10px;border:.5px solid var(--gb);border-radius:var(--rs);background:var(--bg3);color:var(--text);outline:none;font-family:inherit;resize:vertical";ta.value=t.notas||"";
    row.appendChild(label);row.appendChild(ta);list.appendChild(row);return;
  }
  const qs=SECCIONES[editSec],answers=t.secciones[editSec]||[];
  qs.forEach((q,i)=>{
    const row=document.createElement("div");row.className="form-row";
    const label=document.createElement("label");label.className="form-label";label.textContent=q;
    const ta=document.createElement("textarea");ta.id="eq-"+i;ta.style.cssText="min-height:48px;width:100%;font-size:13px;padding:8px 10px;border:.5px solid var(--gb);border-radius:var(--rs);background:var(--bg3);color:var(--text);outline:none;font-family:inherit;resize:vertical";ta.value=answers[i]||"";
    row.appendChild(label);row.appendChild(ta);list.appendChild(row);
  });
}
async function saveEdit(){
  const t=DB.find(x=>x.id===activeId);if(!t)return;
  saveEditCurrentSec();
  t.nombre=str(document.getElementById("edit-nombre").value)||t.nombre;
  t.fecha=str(document.getElementById("edit-fecha").value)||t.fecha;
  t.equipo=str(document.getElementById("edit-equipo").value);
  t.notas=str(document.getElementById("edit-notas").value);
  await saveDB();closeEditModal();renderRepo();renderDetail(t,activeSec);showToast("Cambios guardados");
}
function confirmDelete(){
  const t=DB.find(x=>x.id===activeId);if(!t)return;
  if(!confirm("\u00bfEliminar la visita de "+t.nombre+"? No se puede deshacer."))return;
  DB=DB.filter(x=>x.id!==activeId);closeDetail();saveDB();renderRepo();showToast("Visita eliminada");
}
function showToast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),3500);}

loadDB().then(()=>renderRepo());

</script>
